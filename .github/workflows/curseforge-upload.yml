name: Publish release to CurseForge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, for example v0.8.1
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: curseforge-publish
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Upload verified ZIP and publish automatically after moderator approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG"
