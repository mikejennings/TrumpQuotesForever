name: Prepare five-day release draft

on:
  schedule:
    - cron: '43 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-release-draft
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GIT_AUTHOR_NAME: TQ Maintainers
      GIT_AUTHOR_EMAIL: tq-maintainers@users.noreply.github.com
      GIT_COMMITTER_NAME: TQ Maintainers
      GIT_COMMITTER_EMAIL: tq-maintainers@users.noreply.github.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check elapsed time, approved changes and pending drafts
        id: plan
        run: |
          set -euo pipefail
          python3 scripts/scheduled_updates.py plan-release
          if [ -f dist/release-version.txt ]; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install test runtimes
        if: steps.plan.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luajit
      - name: Test and build only approved main content
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/quote_tools.py validate
          python3 scripts/quote_tools.py render --check
          lua5.1 tests/test.lua
          luajit tests/test.lua
          version=$(cat dist/release-version.txt)
          python3 scripts/quote_tools.py release --version "$version"
      - name: Save versioned source and create an unpublished release draft
        if: steps.plan.outputs.due == 'true'
        run: |
          set -euo pipefail
          version=$(cat dist/release-version.txt)
          branch="automation/release-v${version}"
          git checkout -b "$branch"
          git add TrumpQuotesForever/TrumpQuotesForever.toc TrumpQuotesForever/QUOTE_CATALOG.md README.md
          git commit -m "Prepare version ${version} from reviewed main" --allow-empty
          git push origin "HEAD:$branch"
          python3 - <<'PY'
          from pathlib import Path
          version = Path('dist/release-version.txt').read_text().strip()
          Path('/tmp/release-notes.md').write_text(f'''WoW Forever {version}; interface 16001.

          UNPUBLISHED DRAFT — inspect changes and assets before choosing Publish release.
          Contains only content already on main; pending quote PRs are not included.
          The source branch contains a version bump and matching generated version labels.

          Install TrumpQuotesForever-{version}.zip by extracting its top-level folder into Interface/AddOns.
          Includes SHA-256 checksum and release.json for Forever addon managers.
          Anonymous package checks, Python tests, Lua and LuaJIT tests passed.
          The posting timer starts off. Live-client public-channel delivery remains unverified.

          No automatic publishing, CurseForge upload, or acceptance of pending proposals.
          ''')
          PY
          gh release create "v${version}" dist/release/*.zip dist/release/*.sha256 dist/release/release.json \
            --draft --target "$(git rev-parse HEAD)" \
            --title "Trump Quotes Forever ${version} (WoW Forever)" --notes-file /tmp/release-notes.md
